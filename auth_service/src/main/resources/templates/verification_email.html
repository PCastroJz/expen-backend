<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Verification Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .email-container {
            max-width: 600px;
            background: white;
            margin: auto;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: #5ECDD1;
            color: white;
            text-align: center;
            padding: 10px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .code {
            font-size: 32px;
            font-weight: bold;
            color: #5ECDD1;
            margin: 20px 0;
        }

        .footer {
            font-size: 12px;
            text-align: center;
            color: #888;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        a {
            color: #5ECDD1;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <img src="https://imgur.com/g65tbL9.png"
                alt="Expen" width="150">
        </div>
        <div class="content">
            <h2>Código de Verificación</h2>
            <p>Tu código de verificación es:</p>
            {{digits}}
            <p>Este código es valido por 10 minutos. Por favor no lo compartas con nadie.</p>
            <p>Si tu no hiciste esta solicitud, porfavor <a href="#">actualiza tu contraseña</a> de inmediato.</p>
        </div>
        <div class="footer">
            &copy; 2025 Expen, Todos los derechos reservados.
        </div>
    </div>
</body>

</html>
